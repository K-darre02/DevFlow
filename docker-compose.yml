services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: devflow
      POSTGRES_PASSWORD: "${DEV_DB_PASSWORD}"
      POSTGRES_DB: devflow
    ports:
      - "5432:5432"
    volumes:
      - devflow-postgres-data:/var/lib/postgresql/data

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    ports:
      - "10000:10000" # blob endpoint

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI

volumes:
  devflow-postgres-data:
